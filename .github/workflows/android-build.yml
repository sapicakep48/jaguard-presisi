name: Build JAGUARD PRESISI APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Bubblewrap CLI & Build APK
        run: |
          npm install -g @bubblewrap/cli
          keytool -genkey -v -keystore android.keystore -alias androidbuilder -keyalg RSA -keysize 2048 -validity 10000 -storepass password123 -keypass password123 -dname "CN=Jaguard, OU=Presisi, O=Jaguard, L=City, S=State, C=ID"
          npx bubblewrap init --manifest=manifest.json --directory=./build-app --skip-jdk-check
          cd build-app
          npx bubblewrap build --signingKeyPath=../android.keystore --signingKeyAlias=androidbuilder

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: JAGUARD_PRESISI_APK
          path: build-app/*.apk
