name: Build JAGUARD PRESISI APK

on:
  push:
    branches:
      - main
      - master

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Build Android APK (TWA)
        uses: pwa-builder/builder-action@v1
        with:
          manifest-url: 'https://raw.githubusercontent.com/sapicakep48/jaguard-presisi/main/manifest.json'

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v3
        with:
          name: JAGUARD_PRESISI_APK
          path: ./*.apk
