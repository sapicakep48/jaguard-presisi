name: Build JAGUARD PRESISI APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build APK via Cordova
        run: |
          npm install -g cordova
          cordova create jaguard_app com.jaguard.presisi "JAGUARD PRESISI"
          cp index.html manifest.json jaguard_app/www/
          cd jaguard_app
          cordova platform add android
          cordova build android --release -- --packageType=apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: JAGUARD_PRESISI_APK
          path: jaguard_app/platforms/android/app/build/outputs/apk/release/*.apk
