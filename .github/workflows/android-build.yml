name: Build JAGUARD PRESISI APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build & Sign APK via Cordova
        run: |
          npm install -g cordova
          cordova create jaguard_app com.jaguard.presisi "JAGUARD PRESISI"
          cp index.html manifest.json jaguard_app/www/
          cd jaguard_app
          cordova platform add android
          keytool -genkey -v -keystore release.keystore -alias jaguard -keyalg RSA -keysize 2048 -validity 10000 -storepass 123456 -keypass 123456 -dname "CN=Jaguard, OU=Presisi, O=Jaguard, L=City, S=State, C=ID"
          cordova build android --release
          cd platforms/android/app/build/outputs/apk/release/
          jarsigner -verbose -sigalg SHA1withRSA -digestalg SHA1 -keystore ../../../../../release.keystore -storepass 123456 app-release-unsigned.apk jaguard
          mv app-release-unsigned.apk JAGUARD_PRESISI_SIGNED.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: JAGUARD_PRESISI_APK
          path: jaguard_app/platforms/android/app/build/outputs/apk/release/JAGUARD_PRESISI_SIGNED.apk
